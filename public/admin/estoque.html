<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Alexandria - Controle de Estoque</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header Unificado -->
  <header>
    <a href="/admin/index.html" class="logo">📚 Livraria Alexandria — Control Center</a>
    <nav class="user-nav" style="display: flex; gap: 15px; align-items: center; font-size: 0.85rem;">
      <a href="/admin/index.html">🏠 Hub Admin</a>
      <a href="/admin/pedidos.html">📦 Pedidos</a>
      <a href="/admin/clientes.html">👥 Clientes</a>
      <a href="/admin/estoque.html">📚 Estoque</a>
      <a href="/admin/trocas.html">🔄 Trocas</a>
      <a href="/admin/analise.html">📊 BI / Analítico</a>
      <a href="/index.html" style="margin-left: 10px; color: var(--palette-sand); font-weight: bold;">🛍️ Ver Loja</a>
    </nav>
  </header>

  <main class="container" style="max-width: 1100px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h3 class="section-title" style="margin: 0;">Controle de Estoque do Acervo</h3>
      <button class="btn-buy" style="background: var(--palette-teal-dark);" onclick="abrirModalNovoLivro()">+ Cadastrar Nova Obra</button>
    </div>

    <!-- Tabela de Controle de Inventário -->
    <section style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.85rem;">
        <thead>
          <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-title);">
            <th style="padding: 10px;">Obra / Autor</th>
            <th style="padding: 10px;">ISBN</th>
            <th style="padding: 10px;">Preço Un.</th>
            <th style="padding: 10px; text-align: center;">Qtd. Atual</th>
            <th style="padding: 10px; text-align: center;">Estoque Mínimo</th>
            <th style="padding: 10px;">Status</th>
            <th style="padding: 10px; text-align: center;">Ações de Movimentação</th>
          </tr>
        </thead>
        <tbody id="tabela-estoque-body">
          <!-- Renderizado via JS -->
        </tbody>
      </table>
    </section>

    <!-- Modal de Cadastro de Nova Obra -->
    <div id="modal-novo-livro" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;">
      <div style="background: white; width: 90%; max-width: 550px; border-radius: 8px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">
          <h4 style="font-family: var(--font-heading); color: var(--palette-navy-dark); margin: 0;">Cadastrar Nova Obra no Acervo</h4>
          <button type="button" onclick="fecharModalLivro()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
        </div>

        <form id="form-novo-livro" style="display: flex; flex-direction: column; gap: 12px; font-size: 0.85rem;">
          <div>
            <label style="font-weight: bold; display: block; margin-bottom: 4px;">Título da Obra:</label>
            <input type="text" id="book-titulo" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: bold; display: block; margin-bottom: 4px;">Autor:</label>
              <input type="text" id="book-autor" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            </div>
            <div>
              <label style="font-weight: bold; display: block; margin-bottom: 4px;">ISBN:</label>
              <input type="text" id="book-isbn" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            </div>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px;">
            <div>
              <label style="font-weight: bold; display: block; margin-bottom: 4px;">Preço (R$):</label>
              <input type="number" step="0.01" id="book-preco" required style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            </div>
            <div>
              <label style="font-weight: bold; display: block; margin-bottom: 4px;">Qtd. Inicial:</label>
              <input type="number" id="book-quantidade" required min="0" value="10" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            </div>
            <div>
              <label style="font-weight: bold; display: block; margin-bottom: 4px;">Estoque Mínimo:</label>
              <input type="number" id="book-estoque-minimo" required min="1" value="5" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px;">
            </div>
          </div>

          <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
            <button type="button" onclick="fecharModalLivro()" style="background: #94a3b8; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;">Cancelar</button>
            <button type="submit" class="btn-buy" style="background: var(--palette-teal-dark);">Cadastrar e Salvar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="/js/admin-estoque.js"></script>
</body>
</html>
