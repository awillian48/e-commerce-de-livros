<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Alexandria - Hub Analítico & BI</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <a href="/admin/index.html" class="logo">🛡️ Livraria Alexandria — Control Center</a>
    <nav class="user-nav" style="display: flex; gap: 15px; align-items: center; font-size: 0.85rem;">
      <a href="/admin/index.html">🏠 Hub Admin</a>
      <a href="/admin/pedidos.html">📦 Pedidos</a>
      <a href="/admin/clientes.html">👥 Clientes</a>
      <a href="/admin/estoque.html">📚 Estoque</a>
      <a href="/admin/trocas.html">🔄 Trocas</a>
      <a href="/admin/analise.html" style="color: var(--palette-sand); font-weight: bold;">📊 BI / Analítico</a>
      <a href="/index.html" style="margin-left: 10px; color: var(--palette-sand); font-weight: bold; text-decoration: none;">👁️ Ver Loja</a>
    </nav>
  </header>

  <main class="container" style="max-width: 1100px;">
    <h3 class="section-title">Painel de Métricas e Performance de Vendas</h3>

    <!-- Barra de Filtros de Período e Data Específica -->
    <section style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 15px 20px; margin-bottom: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
      <form onsubmit="return false;" style="display: flex; gap: 15px; align-items: flex-end; flex-wrap: wrap; font-size: 0.85rem;">
        
        <div>
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Atalhos de Período:</label>
          <select id="select-preset-periodo" style="padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; background: #f8fafc;">
            <option value="MES_ATUAL">Mês Atual</option>
            <option value="HOJE">Hoje</option>
            <option value="7_DIAS">Últimos 7 Dias</option>
            <option value="CUSTOM">Personalizado</option>
          </select>
        </div>

        <div>
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Data Inicial:</label>
          <input type="date" id="filtro-data-inicio" style="padding: 7px; border: 1px solid #cbd5e1; border-radius: 4px;">
        </div>

        <div>
          <label style="display: block; font-weight: bold; margin-bottom: 4px;">Data Final:</label>
          <input type="date" id="filtro-data-fim" style="padding: 7px; border: 1px solid #cbd5e1; border-radius: 4px;">
        </div>

        <button type="button" id="btn-aplicar-filtro" class="btn-buy" style="background: var(--palette-teal-dark); padding: 8px 18px;">🔍 Filtrar Período</button>
      </form>
    </section>

    <!-- Indicadores Chave de Desempenho (KPIs) -->
    <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px;">
      <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; text-align: center;">
        <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase;">Faturamento Total</span>
        <div id="kpi-faturamento" style="font-size: 1.6rem; font-weight: bold; color: var(--palette-navy-dark); margin-top: 5px;">R$ 0,00</div>
      </div>

      <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; text-align: center;">
        <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase;">Total de Pedidos</span>
        <div id="kpi-pedidos" style="font-size: 1.6rem; font-weight: bold; color: var(--palette-teal-dark); margin-top: 5px;">0</div>
      </div>

      <div style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; text-align: center;">
        <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase;">Ticket Médio</span>
        <div id="kpi-ticket-medio" style="font-size: 1.6rem; font-weight: bold; color: var(--palette-terracotta); margin-top: 5px;">R$ 0,00</div>
      </div>
    </section>

    <!-- Gráfico Dinâmico Chart.js -->
    <section style="background: white; border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
      <h4 style="font-family: var(--font-heading); color: var(--palette-navy-dark); margin-top: 0; margin-bottom: 15px;">Faturamento Agrupado por Data no Período</h4>
      <canvas id="grafico-faturamento-canvas" style="max-height: 380px;"></canvas>
    </section>
  </main>

  <script src="/js/admin-analise.js"></script>
</body>
</html>
