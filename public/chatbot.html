<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Alexandria - Chatbot de Recomendação</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="logo">Livraria Alexandria</a>
    <nav class="user-nav">
      <a href="index.html">← Voltar ao Acervo</a>
    </nav>
  </header>

  <main class="container">
    <h3 class="section-title">Assistente Virtual de Recomendações</h3>

    <section style="background: white; border: 1px solid var(--border-color); border-radius: 6px; padding: 20px; max-width: 700px; margin: 0 auto; box-shadow: 0 2px 5px rgba(0,0,0,0.03);">
      <div id="chat-log" style="height: 320px; overflow-y: auto; border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; margin-bottom: 15px; background: #fbf8f3; display: flex; flex-direction: column;">
        <div style="background: #f0ebe1; color: var(--text-dark); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 8px; font-family: sans-serif; font-size: 0.9rem; margin-bottom: 12px; max-width: 80%;">
          <strong>Livreiro Virtual:</strong> Olá! Que tipo de leitura você procura hoje? (ex: romances clássicos, literatura nacional ou tecnologia)
        </div>
      </div>

      <form id="chat-form" style="display: flex; gap: 10px;">
        <input type="text" id="chat-input" placeholder="Digite o tema ou gênero desejado..." style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: sans-serif;" required>
        <button type="submit" class="btn-buy" style="padding: 10px 20px;">Enviar</button>
      </form>
    </section>
  </main>

  <script src="/js/chatbot.js"></script>
</body>
</html>
