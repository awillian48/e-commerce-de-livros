<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Livraria Alexandria - Consulta de Clientes</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header style="background: #1b2a47; color: white; padding: 16px 5%; display: flex; align-items: center; justify-content: space-between; gap: 15px;">
    <a href="/index.html" class="logo" style="font-family: var(--font-heading); font-size: 1.4rem; font-weight: 700; color: #ffffff; text-decoration: none; letter-spacing: -0.02em;">Livraria Alexandria</a>
    <nav class="user-nav" style="display: flex; gap: 12px; align-items: center; font-size: 0.85rem;">
      <a href="/admin/clientes.html" style="background: var(--palette-teal-dark); color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-weight: bold;">Painel de Clientes</a>
      <a href="/index.html" style="color: #ffffff; text-decoration: none;">Voltar para a Loja</a>
    </nav>
  </header>

  <main class="container" style="max-width: 1100px; margin-top: 25px;">
    <h3 class="section-title">Consulta de Clientes (RF0024)</h3>

    <!-- RF0024: Filtro combinado ou isolado por campos de identificação -->
    <section class="section-card" style="padding: 18px; margin-bottom: 20px;">
      <form id="form-consulta" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;" onsubmit="realizarBusca(event)">
        <input type="text" id="campo-nome" placeholder="Nome do Cliente" class="form-input">
        <input type="text" id="campo-cpf" placeholder="CPF" class="form-input">
        <input type="email" id="campo-email" placeholder="E-mail" class="form-input">
        <select id="campo-status" class="form-input">
          <option value="">Todos os Status</option>
          <option value="ATIVO">Ativo</option>
          <option value="INATIVO">Inativo</option>
        </select>
        <button type="submit" class="btn-buy" style="background: var(--palette-navy-dark); padding: 8px;">Pesquisar</button>
      </form>
    </section>

    <!-- Tabela de Resultados, Ranking (RN0027) e Inativação (RF0023) -->
    <section class="section-card" style="padding: 20px;">
      <table class="table-default" style="width: 100%;">
        <thead>
          <tr>
            <th>Código (RNF0035)</th>
            <th>Cliente</th>
            <th>CPF / E-mail</th>
            <th>Ranking (RN0027)</th>
            <th>Status</th>
            <th style="text-align: center;">Ações</th>
          </tr>
        </thead>
        <tbody id="tabela-consulta-body">
          <!-- Carregado via JS -->
        </tbody>
      </table>
    </section>
  </main>

  <script>
    async function carregarDados(query = '') {
      const tbody = document.getElementById('tabela-consulta-body');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Carregando clientes...</td></tr>';
      try {
        const res = await fetch('/api/clientes' + (query ? '?' + query : ''));
        const clientes = await res.json();
        tbody.innerHTML = '';
        if (clientes.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 20px;">Nenhum cliente encontrado.</td></tr>';
          return;
        }
        clientes.forEach(c => {
          const isAtivo = c.status === 'ATIVO';
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td style="font-weight: bold; color: var(--palette-navy-dark);">${c.codigo || c.id}</td>
            <td><strong>${c.nome}</strong></td>
            <td>${c.cpf}<br><small style="color: var(--text-muted);">${c.email}</small></td>
            <td><span class="ranking-pill">Nível <strong>${c.ranking || 1}</strong> / 5</span></td>
            <td><span class="badge-${isAtivo ? 'success' : 'danger'}">${c.status}</span></td>
            <td style="text-align: center;">
              <a href="/admin/clientes.html" class="btn-sm" style="background: var(--palette-teal-dark); color: white; text-decoration: none; display: inline-block;">Gerenciar Cliente</a>
            </td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Erro ao carregar dados.</td></tr>';
      }
    }

    function realizarBusca(e) {
      e.preventDefault();
      const nome = document.getElementById('campo-nome').value.trim();
      const cpf = document.getElementById('campo-cpf').value.trim();
      const email = document.getElementById('campo-email').value.trim();
      const status = document.getElementById('campo-status').value;

      const p = new URLSearchParams();
      if (nome) p.append('nome', nome);
      if (cpf) p.append('cpf', cpf);
      if (email) p.append('email', email);
      if (status) p.append('status', status);

      carregarDados(p.toString());
    }

    document.addEventListener('DOMContentLoaded', () => carregarDados());
  </script>
</body>
</html>
